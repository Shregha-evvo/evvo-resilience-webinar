# Netlify configuration for the EDM Resilience Webinar site.
#
# This site has no build step. Netlify still runs deploy-time post-processing,
# which is what detects the "webinar-registration" form in register.html, and
# it still applies the redirect rules below.

[build]
  publish = "."

# Declared outside [build] so the setting applies even though no build runs.
[functions]
  directory = "netlify/functions"

# ---------------------------------------------------------------------------
# Security rules.
#
# The retired PHP implementation is kept on the local disk as a rollback but is
# excluded from Git, so it should never reach a deploy. Netlify cannot execute
# PHP and would serve any such file as readable plain text.
#
# These rules are a second line of defence in case one is ever added back.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/vendor/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/send-mail.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/router.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.htaccess"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/serve.ps1"
  to = "/404.html"
  status = 404
  force = true

# The functions directory sits inside the publish directory, so without this
# the function's source would be downloadable at /netlify/functions/...
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Root route.
#
# The site has no index.html, so without this rule "/" matches nothing and
# Netlify serves 404.html.
#
# status = 200 makes this a REWRITE, not a redirect: Netlify serves the
# contents of register.html while the address bar stays at "/". That matters
# because the form posts to "/". A 301/302 here would be followed by the
# browser as a GET, silently dropping the POST body, so the page would show
# its success state while nothing was ever stored.
#
# No "force" flag: if an index.html is added later it should win over this rule.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/"
  to = "/register.html"
  status = 200
