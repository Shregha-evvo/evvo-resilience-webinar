<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &middot; Evvo Labs</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#F4F6FB;color:#1A1E33;padding:32px;
       font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .box{width:100%;max-width:440px;background:#fff;border-radius:16px;overflow:hidden;
       box-shadow:0 2px 4px rgba(16,22,64,.06),0 28px 60px -20px rgba(16,22,64,.28)}
  .top{height:4px;background:linear-gradient(90deg,#F05A2B,#4DE8FF)}
  .in{padding:32px}
  p.eyebrow{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.16em;
            text-transform:uppercase;color:#F05A2B}
  h1{margin:0 0 10px;font-size:22px;letter-spacing:-.025em}
  p.msg{margin:0 0 22px;font-size:14.5px;line-height:1.55;color:#5B6070}
  a{display:inline-block;padding:12px 20px;border-radius:10px;background:#F05A2B;
    color:#fff;text-decoration:none;font-size:14.5px;font-weight:600}
  a:hover{background:#D94A1E}
</style>
</head>
<body>
  <div class="box">
    <div class="top"></div>
    <div class="in">
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p class="msg">That page doesn&rsquo;t exist or has moved.</p>
      <a href="/register.html">Go to registration</a>
    </div>
  </div>
</body>
</html>
